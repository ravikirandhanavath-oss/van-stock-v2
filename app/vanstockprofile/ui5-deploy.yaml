# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.vanstockv2
type: application
builder:
  componentPreload:
    excludes:
      - "com/vanstockv2/ext/lib/**"
  minification:
    excludes:
      - "com/vanstockv2/ext/lib/**"
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: vanstockprofile
        relativePaths: true
        additionalFiles:
          - xs-app.json
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: comvanstockv2
        relativePaths: true
        additionalFiles:
          - xs-app.json
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
